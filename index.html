<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALEA</title>
<style>
  /* --- STILI DEL PLAYER --- */
  .player {
    max-width: 560px;
    margin: 4rem auto; 
    color: black; 
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .track {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 0.9rem;
    align-items: center;
    padding: 0.8rem 0;
  }
  .btn {
    grid-row: 1 / span 2;
    background: none;
    border: 0;
    padding: 0;
    width: 2rem;
    height: 2rem;
    display: grid;
    place-items: center;
    color: inherit;
    cursor: pointer;
  }
  .btn svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .btn .i-pause { display: none; }
  .track.playing .i-play { display: none; }
  .track.playing .i-pause { display: block; }

  .title {
    font-weight: 500;
    -webkit-text-stroke: 0.4px currentColor;
    margin-bottom: 0.35rem;
  }

  .bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }
  .bar .t { min-width: 2.6em; }
  .bar .t.end { text-align: right; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    margin: 0;
    border-radius: 2px;
    background: linear-gradient(to right, currentColor var(--p, 0%), rgba(0,0,0,0.35) var(--p, 0%));
    color: inherit;
    cursor: pointer;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: currentColor;
    border: 0;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: currentColor;
    border: 0;
  }
  input[type=range]::-moz-range-track { background: rgba(0,0,0,0.35); height: 4px; border-radius: 2px; }
  input[type=range]::-moz-range-progress { background: currentColor; height: 4px; border-radius: 2px; }
  
  /* --- STILI BOX PASSWORD --- */
  #pwd-container {
    display: flex;
    gap: 10px;
    margin-top: -80px; 
    z-index: 1000;
  }
  #pwd {
    padding: 0.8rem;
    font-size: 1rem;
    border: 2px solid black;
    background: transparent;
    color: black;
    outline: none;
    font-family: Arial, sans-serif;
  }
  #pwd::placeholder {
    color: rgba(0,0,0,0.6);
  }
  #pwd-btn {
    padding: 0.8rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    border: 2px solid black;
    background: black;
    color: rgb(221, 30, 30);
    font-weight: bold;
    font-family: Arial, sans-serif;
  }

  /* --- STILI TITOLI SITO (Desktop Base) --- */
  .titoli-sito {
    text-align: center;
  }
  .titoli-sito h1 {
    font-size: 400px;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    line-height: 0.9;
  }
  .titoli-sito h2 {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    letter-spacing: 439px;
    transform: translate(213px, -30px);
  }

  /* --- MEDIA QUERY (Adattamento per Tablet e Telefoni) --- */
  @media (max-width: 1100px) {
    /* Rimpicciolisce i titoli in proporzione allo schermo */
    .titoli-sito h1 {
      font-size: 26vw; /* vw = percentuale della larghezza schermo */
    }
    .titoli-sito h2 {
      font-size: 5vw;
      letter-spacing: 22vw;
      transform: translate(11vw, -5vw);
    }
    /* Impila password e bottone su schermi piccoli */
    #pwd-container {
      flex-direction: column;
      width: 80%;
      max-width: 300px;
      margin-top: -30px;
    }
    #pwd, #pwd-btn {
      width: 100%;
      box-sizing: border-box;
    }
    /* Dà margine al player laterale per non toccare i bordi del telefono */
    .player {
      width: 90%;
      margin: 2rem auto;
    }
  }
</style>
</head>
<body style="background-color:rgb(221, 30, 30); margin: 0; overflow-x: hidden;">

<!-- Schermata di ingresso (Copertina) -->
<div id="ingresso" style="position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgb(221, 30, 30); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <img src="logo_red_black.png" alt="SIGA" width="900" height="900" style="max-width: 100%; height: auto;">
  
  <div id="pwd-container">
    <input type="password" id="pwd" placeholder="Inserisci password">
    <button id="pwd-btn" onclick="controllaPassword()">ENTRA</button>
  </div>
</div>

<!-- Contenuto principale del sito (Stili spostati nel CSS) -->
<div class="titoli-sito">
  <h1>PAPRIKA!</h1> 
  <h2>PALEA</h2>
</div>

<!-- Container del Player -->
<div class="player" id="player"></div>

<script>
  // Logica della password
  function controllaPassword() {
    const passwordInserita = document.getElementById('pwd').value.trim().toLowerCase();
    
    if (passwordInserita === 'sogni') {
      document.getElementById('ingresso').style.display = 'none';
    } else {
      // Fa partire l'audio di errore
      const erroreAudio = new Audio('Password_Errata.mp3');
      erroreAudio.play();
      
      // Svuota il campo testuale
      document.getElementById('pwd').value = '';
    }
  }

  // Permette di premere "Invio"
  document.getElementById('pwd').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
      controllaPassword();
    }
  });

  // Configurazione tracce del player
  const tracks = [
    { title: "Detachment",                          src: "1_DETACHMENT_MIX_V3.1.mp3" },
    { title: "DOA",                                 src: "2_DOA_MIX_V3.1.mp3" },
    { title: "Grandma's House",                     src: "3_TURBO_MIX_V3.1.mp3" },
    { title: "Whole/Tunnel",                        src: "4_TUNNEL_MIX_V3.1.mp3" },
    { title: "You Know",                            src: "5_YOU KNOW_MIX_V3.1.mp3" },
    { title: "Juana",                               src: "6_JUANA_MIX_V3.1.mp3" },
    { title: "ALL MY FRIENDS ARE IN A ZOO",         src: "7_ALL MY FRIENDS ARE IN A ZOO_MIX_V3.1.mp3" },
    { title: "Anteaters",                           src: "8_TESTOTSM_MIX_V3.1.mp3" },
    { title: "Akira",                               src: "9_AKIRA_MIX_V3.1.mp3" },
    { title: "The man who only drew candelabras",   src: "11_STEVENS_MIX_V3.1.mp3" },
    { title: "Defeatist - Cameras (PALEA rework)",  src: "10_DEFEATIST_MIX_V3.1.mp3" }
  ];

  const container = document.getElementById("player");
  const players = [];

  container.addEventListener("contextmenu", e => e.preventDefault());

  const fmt = s => {
    if (!isFinite(s)) return "0:00";
    const m = Math.floor(s / 60);
    const r = Math.floor(s % 60).toString().padStart(2, "0");
    return m + ":" + r;
  };

  tracks.forEach((t, i) => {
    const row = document.createElement("div");
    row.className = "track";
    row.innerHTML =
      '<button class="btn" type="button" aria-label="Play / Pausa">' +
        '<svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>' +
        '<svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>' +
      '</button>' +
      '<div class="title"></div>' +
      '<div class="bar">' +
        '<span class="t cur">0:00</span>' +
        '<input type="range" min="0" max="1000" value="0" step="1" aria-label="Posizione">' +
        '<span class="t end">0:00</span>' +
      '</div>';
    row.querySelector(".title").textContent = t.title;

    const btn = row.querySelector(".btn");
    const slider = row.querySelector("input");
    const cur = row.querySelector(".cur");
    const end = row.querySelector(".end");

    const audio = new Audio();
    audio.preload = "metadata";
    audio.controlsList = "nodownload";
    audio.disableRemotePlayback = true;
    audio.src = t.src;

    const setProgress = () => {
      const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      slider.value = p * 10;
      slider.style.setProperty("--p", p + "%");
      cur.textContent = fmt(audio.currentTime);
    };

    audio.addEventListener("loadedmetadata", () => { end.textContent = fmt(audio.duration); });
    audio.addEventListener("timeupdate", setProgress);
    audio.addEventListener("play", () => {
      players.forEach(p => { if (p.audio !== audio) p.audio.pause(); });
      row.classList.add("playing");
    });
    audio.addEventListener("pause", () => row.classList.remove("playing"));
    audio.addEventListener("ended", () => {
      row.classList.remove("playing");
      if (players[i + 1]) players[i + 1].audio.play();
    });

    btn.addEventListener("click", () => { audio.paused ? audio.play() : audio.pause(); });
    slider.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (slider.value / 1000) * audio.duration;
        setProgress();
      }
    });

    players.push({ audio });
    container.appendChild(row);
  });
</script>
</body>
</html>
